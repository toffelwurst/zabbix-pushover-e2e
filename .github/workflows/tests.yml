name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # Offline suite: primitives vs Node crypto/zlib, webhook vs upstream, openssl round trips.
    # The Duktape integration test needs containers and runs manually (test/env.sh, test/integration_test.sh).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml xxd openssl gzip
      - name: Build and verify dist is up to date
        run: |
          python3 -I build.py
          git diff --exit-code dist/
      - name: Run tests
        run: ./run_tests.sh

  integration:
    # Real alert flow in a throwaway Zabbix 8.0 (Duktape engine) with a fake Pushover endpoint:
    # non-ASCII trigger name, over-long emoji title (truncation inside Duktape), all fields decrypted with openssl.
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xxd openssl gzip
      - name: Start throwaway Zabbix
        run: test/env.sh up
      - name: Integration test
        run: |
          set -o pipefail
          test/integration_test.sh 2>&1 | tee integration.log
      - name: Diagnostics on failure
        if: failure()
        run: |
          # job logs need repo admin rights to download; annotations are public, so surface the essentials there
          enc() { python3 -c 'import sys; print(sys.stdin.read()[-3500:].replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::error title=integration output::$( (tail -n 40 integration.log 2>/dev/null || echo 'no output') | enc)"
          for c in zbx-server zbx-web zbx-echo zbx-agent; do
            echo "::error title=logs $c::$(docker logs --tail 25 $c 2>&1 | enc)"
          done
      - name: Tear down
        if: always()
        run: test/env.sh down

